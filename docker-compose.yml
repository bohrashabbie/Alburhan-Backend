# Local development: PostgreSQL + API. Production on EC2 uses RDS/remote Postgres instead of `db`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: alburhan_erp
      POSTGRES_USER: alburhan_app
      POSTGRES_PASSWORD: alburhan_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alburhan_app -d alburhan_erp"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://alburhan_app:alburhan_dev@db:5432/alburhan_erp
    ports: ["8000:8000"]
    volumes: [".:/app", "/app/.venv"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
