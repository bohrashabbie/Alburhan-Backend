# /etc/nginx/sites-available/alburhan-erp  (symlink into sites-enabled)
# Starts as plain HTTP; `sudo certbot --nginx -d erp.<domain> -d pos.<domain>` adds HTTPS.
# Replace the two server_name values with your domains.

upstream alburhan_erp_web { server 127.0.0.1:3100; keepalive 16; }
upstream alburhan_erp_api { server 127.0.0.1:8100; keepalive 8; }

# The ERP website. Django serves only its admin and the admin's static files; everything else,
# including /api/*, goes to Next.js, which forwards API calls to Django with the user's token.
server {
    listen 80;
    listen [::]:80;
    server_name erp.alburhan-regional.com;

    client_max_body_size 6m;

    location ~ ^/(admin|static)(/|$) {
        proxy_pass http://alburhan_erp_api;
        include /etc/nginx/snippets/alburhan-erp-proxy.conf;
    }
    location / {
        proxy_pass http://alburhan_erp_web;
        include /etc/nginx/snippets/alburhan-erp-proxy.conf;
    }
}

# The POS website: the same Next.js app; a host starting with "pos." shows only the till.
server {
    listen 80;
    listen [::]:80;
    server_name pos.alburhan-regional.com;

    client_max_body_size 6m;

    location / {
        proxy_pass http://alburhan_erp_web;
        include /etc/nginx/snippets/alburhan-erp-proxy.conf;
    }
}
